openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Encore organizer and volunteer API
servers:
  - url: /api
paths:
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetInput" }
      responses:
        "200":
          description: Reset guidance
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmInput" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /account:
    get:
      operationId: exportAccount
      responses:
        "200":
          description: Download organizer's Encore records
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    delete:
      operationId: deleteAccount
      responses:
        "200":
          description: Account and owned data deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /series/{id}/team:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getSeriesTeam
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: object
                required: [members, is_owner]
                properties:
                  is_owner: { type: boolean }
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, name, role]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        role: { type: string, enum: [owner, editor, viewer] }
  /series/{id}/invites:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: createSeriesInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteInput" }
      responses:
        "200":
          description: One week invitation
          content:
            application/json:
              schema:
                type: object
                required: [id, token]
                properties:
                  id: { type: integer }
                  token: { type: string }
  /series/{id}/invites/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    delete:
      operationId: revokeSeriesInvite
      responses:
        "200":
          description: Link revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /series/{id}/team/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    delete:
      operationId: removeSeriesMember
      responses:
        "200":
          description: Access revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /invites/accept:
    post:
      operationId: acceptSeriesInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteAcceptInput" }
      responses:
        "200":
          description: Joined series
          content:
            application/json:
              schema:
                type: object
                required: [series_id]
                properties:
                  series_id: { type: integer }
  /events/{id}/sponsors:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listSponsors
      responses:
        "200":
          description: Event sponsors
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Sponsor" } }
    post:
      operationId: createSponsor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorInput" }
      responses:
        "200":
          description: Created sponsor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sponsor" }
  /events/{id}/sponsors/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    put:
      operationId: updateSponsor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorInput" }
      responses:
        "200":
          description: Saved sponsor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sponsor" }
    delete:
      operationId: deleteSponsor
      responses:
        "200":
          description: Deleted sponsor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/sponsors/{itemId}/task:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    post:
      operationId: createSponsorTask
      responses:
        "200":
          description: Created next step task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
  /events/{id}/sponsors/{itemId}/draft:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    post:
      operationId: draftSponsorEmail
      responses:
        "200":
          description: Editable copy-only draft
          content:
            application/json:
              schema:
                type: object
                required: [message, notice, ai_remaining]
                properties:
                  message: { type: string }
                  notice: { type: string }
                  ai_remaining: { type: integer }
  /demo/update:
    post:
      operationId: updateDemo
      responses:
        "200":
          description: Updated fictional demo once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
  /events/{id}/reminder/send:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: sendReminder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderSendInput" }
      responses:
        "200":
          description: Send results
          content:
            application/json:
              schema:
                type: object
                required: [sent, failed]
                properties:
                  sent: { type: integer }
                  failed: { type: integer }
  /public/v/{token}/cancel:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelVolunteer
      responses:
        "200":
          description: Cancelled and freed slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/me:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current session and CSRF token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /auth/signup:
    post:
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /auth/login:
    post:
      operationId: logIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /auth/logout:
    post:
      operationId: logOut
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /series:
    get:
      operationId: listSeries
      responses:
        "200":
          description: Owned series
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Series" } }
    post:
      operationId: createSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesInput" }
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
  /series/{id}/dashboard:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Events, progress, latest lesson and reusable resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /series/{id}/events:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: Created event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
  /events/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getEvent
      responses:
        "200":
          description: Full authorized event workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventBundle" }
    patch:
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdate" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
  /events/{id}/messages:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listEventMessages
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Organizer-only messages after the supplied cursor
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TeamMessage" } }
    post:
      operationId: createEventMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Saved organizer message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMessage" }
  /events/{id}/messages/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    delete:
      operationId: deleteEventMessage
      responses:
        "200":
          description: Soft-deleted organizer message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMessage" }
  /events/{id}/announcements:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getEventAnnouncement
      responses:
        "200":
          description: Latest organizer announcement, if one exists
          content:
            application/json:
              schema: { anyOf: [{ $ref: "#/components/schemas/Announcement" }, { type: "null" }] }
    post:
      operationId: createEventAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Saved volunteer announcement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
  /ai/announcement:
    post:
      operationId: draftAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementDraftInput" }
      responses:
        "200":
          description: Editable announcement draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementDraft" }
  /events/{id}/map:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getEventMap
      responses:
        "200":
          description: Organizer-only map and items, or an empty map state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintMap" }
    put:
      operationId: saveEventMap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlueprintMapInput" }
      responses:
        "200":
          description: Saved map background
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintMap" }
  /events/{id}/map/upload-url:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: requestMapUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapUploadInput" }
      responses:
        "200":
          description: Short-lived direct upload URL and private object path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapUploadResponse" }
  /events/{id}/map/items:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: createMapItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapItemInput" }
      responses:
        "200":
          description: Created map item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapItem" }
  /events/{id}/map/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    patch:
      operationId: updateMapItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapItemUpdate" }
      responses:
        "200":
          description: Updated map item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapItem" }
    delete:
      operationId: deleteMapItem
      responses:
        "200":
          description: Deleted map item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/map-sharing:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: updateMapSharing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapSharingInput" }
      responses:
        "200":
          description: Updated volunteer map visibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/accept-plan:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: acceptPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanDraft" }
      responses:
        "200":
          description: Plan explicitly accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/plan-suggestions:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: addPlanSuggestions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanDraft" }
      responses:
        "200":
          description: Added selected tasks and roles without replacing saved work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/tasks:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
  /events/{id}/tasks/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    patch:
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
    delete:
      operationId: deleteTask
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/roles:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
  /events/{id}/roles/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    patch:
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
    delete:
      operationId: deleteRole
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/volunteers/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ItemId" }
    delete:
      operationId: removeVolunteer
      responses:
        "200":
          description: Removed and slot freed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/recap:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      operationId: saveRecap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecapInput" }
      responses:
        "200":
          description: Saved recap and resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /events/{id}/next:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: createNextEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NextInput" }
      responses:
        "200":
          description: New event with selected carry-over only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
  /events/{id}/reminder:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getReminder
      responses:
        "200":
          description: Editable reminder and mailto recipients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
  /demo:
    post:
      operationId: loadDemo
      responses:
        "200":
          description: Idempotently created fictional demo series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
  /ai/plan:
    post:
      operationId: draftPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiInput" }
      responses:
        "200":
          description: AI draft or template, never applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDraft" }
  /ai/helper:
    post:
      operationId: askHelper
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelperInput" }
      responses:
        "200":
          description: Explicitly applicable suggested actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelperDraft" }
  /ai/starter:
    post:
      operationId: draftStarter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiInput" }
      responses:
        "200":
          description: Editable starter items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarterDraft" }
  /public/join/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSignup
      responses:
        "200":
          description: Public event and role availability without personal data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupPage" }
    post:
      operationId: joinEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupInput" }
      responses:
        "200":
          description: Private volunteer token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResult" }
  /public/v/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: getVolunteerPage
      responses:
        "200":
          description: Token-scoped volunteer details and tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolunteerPage" }
  /public/v/{token}/map:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: getVolunteerMap
      responses:
        "200":
          description: Shared volunteer map and their station, or a safe unavailable state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolunteerMap" }
  /public/v/{token}/tasks/{itemId}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/ItemId" }
    patch:
      operationId: tickVolunteerTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TickInput" }
      responses:
        "200":
          description: Updated own checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: integer } }
  schemas:
    PasswordResetInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirmInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 48, maxLength: 128 }
        password: { type: string, minLength: 8, maxLength: 128 }
    InviteInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [editor, viewer] }
    InviteAcceptInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 48, maxLength: 128 }
    ReminderSendInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 5000 }
        volunteer_id: { type: [integer, "null"] }
    SponsorInput:
      type: object
      required: [name, offer_text, status, owner_user_id, amount, next_step_text, next_step_due]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        offer_text: { type: string, maxLength: 2000 }
        status: { type: string, enum: [asked, talking, yes, declined] }
        owner_user_id: { type: [integer, "null"] }
        amount: { type: [number, "null"], minimum: 0, maximum: 1000000000 }
        next_step_text: { type: string, maxLength: 300 }
        next_step_due: { type: [string, "null"] }
    Sponsor:
      allOf:
        - { $ref: "#/components/schemas/SponsorInput" }
        - type: object
          required: [id, event_id, created_at]
          properties:
            id: { type: integer }
            event_id: { type: integer }
            created_at: { type: string }
